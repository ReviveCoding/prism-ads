[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-ads"
version = "0.1.0"
description = "Privacy-resilient incrementality, statistics, and measurement for advertising"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "PRISM-Ads contributors"}]
dependencies = [
  "duckdb>=1.3,<2",
  "dp-accounting>=0.4,<1",
  "numpy>=2,<3",
  "pyarrow>=20,<24",
  "pyro-ppl>=1.9,<2",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "torch>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
prism-ads = "prism_ads.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prism_ads"]
