name: cpu-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      # These two integrity checks require the private local data/state preserved outside the
      # sanitized public snapshot. They remain mandatory in the local publication gate.
      - run: >-
          python -m coverage run --branch -m pytest -q
          -k "not test_repository_controller_verifies and not test_repository_freeze_manifest"
      - run: python -m coverage report --fail-under=80
      - run: python -m ruff check src tests tools
      - run: python -m mypy src tools
