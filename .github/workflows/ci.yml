name: cpu-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: python -m coverage run --branch -m pytest -q
      - run: python -m coverage report --fail-under=80
      - run: python -m ruff check src tests tools
      - run: python -m mypy src tools
